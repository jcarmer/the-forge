# GENERATED by sandboxctl from sandbox.config.ts. Do not edit by hand (run `sandboxctl generate`).
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: the_forge_tailscale
    hostname: ai-sandbox
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=ai-sandbox
      - TS_EXTRA_ARGS=--advertise-tags=tag:ai-sandbox
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ai_sandbox_tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # NOTE: no `ports:` anywhere. Nothing is published on the Windows host.

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: the_forge
    restart: unless-stopped
    # PID 1 must reap orphaned children. Without an init, `sleep infinity` as PID 1 leaves every
    # orphaned git/sh/node (VS Code tooling, nohup'd services) as a zombie until the pid limit is hit.
    init: true
    # Invoke via /bin/bash so the Windows bind-mounted entrypoint.sh never needs +x.
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]
    command: ["sleep", "infinity"]
    network_mode: service:tailscale
    depends_on:
      - tailscale
    stdin_open: true
    tty: true
    working_dir: /projects
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ai_sandbox_repos:/projects
      - ai_sandbox_ollama_models:/root/.ollama
      - ai_sandbox_nuget_cache:/root/.nuget
      - ai_sandbox_claude_config:/root/.claude
      - ai_sandbox_t3_config:/root/.t3
      - ai_sandbox_comfyui_data:/root/comfyui
      - ai_sandbox_vscode_cli:/root/.vscode
      - ai_sandbox_forge_state:/var/lib/the-forge
      - C:/projects/local-only/buddy.env:/root/.buddy/.env:ro
      - C:/projects/local-only/meta/antigravity-data:/root/.gemini
      - C:/projects/local-only/meta/rules:/root/.gemini/config/rules
      - C:/projects/local-only/meta/skills:/root/.gemini/config/skills
      - C:/projects/local-only/meta/tools:/root/.gemini/config/tools
      - C:/projects/local-only/meta/plugins:/root/.gemini/config/plugins
      - C:/projects/local-only/the-forge:/opt/the-forge
      - /var/run/docker.sock:/var/run/docker.sock
      - C:/projects/local-only/the-forge/generated/entrypoint.sh:/usr/local/bin/entrypoint.sh
      - C:/projects/local-only/the-forge/generated/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - GH_TOKEN=${GH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - OLLAMA_EXTRA_MODELS=qwen2.5:7b
      - TOKEN_SAVER_ENABLED=true
      - IS_SANDBOX=1
      - GIT_MAIN_BRANCH=main
      - GIT_INTEGRATION_BRANCH=ai-work

volumes:
  ai_sandbox_repos:
    name: ai_sandbox_repos
  ai_sandbox_ollama_models:
    name: ai_sandbox_ollama_models
  ai_sandbox_nuget_cache:
    name: ai_sandbox_nuget_cache
  ai_sandbox_claude_config:
    name: ai_sandbox_claude_config
  ai_sandbox_t3_config:
    name: ai_sandbox_t3_config
  ai_sandbox_comfyui_data:
    name: ai_sandbox_comfyui_data
  ai_sandbox_vscode_cli:
    name: ai_sandbox_vscode_cli
  ai_sandbox_forge_state:
    name: ai_sandbox_forge_state
  ai_sandbox_tailscale_state:
    name: ai_sandbox_tailscale_state
